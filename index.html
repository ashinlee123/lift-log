<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健力日誌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>健力日誌</title>
<meta name="theme-color" content="#121316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone logbook. Sticky week/day selector on top, set rows as a gym logsheet, tab bar fixed to the bottom. Lift colors follow IPF calibrated plates: red 25 (squat), blue 20 (bench), yellow 15 (deadlift). */
:root{
  --bg:#eceeeb; --surface:#ffffff; --surface-2:#f4f5f3; --ink:#16181b; --muted:#5f666c; --line:#d6dad5;
  --accent:#c9252b; --accent-ink:#ffffff; --accent-soft:#c9252b1a;
  --squat:#c9252b; --bench:#1d5fc4; --dead:#b88a00; --acc:#6a7177;
  --good:#1d8a4b; --good-soft:#1d8a4b1f; --warn:#a96400; --warn-soft:#a964001f;
  --display:"Barlow Condensed","Arial Narrow","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#1a1c1f; --surface-2:#222529; --ink:#ecebe7; --muted:#9aa1a7; --line:#2d3136;
  --accent:#ff544a; --accent-ink:#16090a; --accent-soft:#ff544a24;
  --squat:#ff544a; --bench:#5d9cff; --dead:#f0c23a; --acc:#9aa1a7;
  --good:#3fcf7d; --good-soft:#3fcf7d22; --warn:#f2a640; --warn-soft:#f2a64022; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1a1c1f; --surface-2:#222529; --ink:#ecebe7; --muted:#9aa1a7; --line:#2d3136;
  --accent:#ff544a; --accent-ink:#16090a; --accent-soft:#ff544a24;
  --squat:#ff544a; --bench:#5d9cff; --dead:#f0c23a; --acc:#9aa1a7;
  --good:#3fcf7d; --good-soft:#3fcf7d22; --warn:#f2a640; --warn-soft:#f2a64022; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand h1 b{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.weeks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px 6px;text-align:left;min-width:64px;display:grid;gap:2px}
.wk .n{font-family:var(--display);font-weight:700;font-size:18px;line-height:1}
.wk .l{font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap}
.wk .pips{display:flex;gap:3px;margin-top:2px}
.wk .pips span{width:9px;height:3px;border-radius:2px;background:var(--line)}
.wk .pips span.on{background:var(--good)}
.wk.deload{border-style:dashed}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.wk[aria-pressed="true"] .l{color:inherit;opacity:.75}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.dy{border:0;background:transparent;border-radius:7px;padding:6px 2px;font-family:var(--display);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:5px}
.dy[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px #0002}
.dy .ok{width:15px;height:15px;border-radius:50%;background:var(--good);color:var(--surface);font-size:10px;display:inline-grid;place-items:center;font-family:var(--body)}

main .wrap{padding-block:16px 150px;display:grid;gap:14px}

/* day header */
.dayhead{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.dayhead h2{margin:0;font-family:var(--display);font-size:30px;line-height:1.05;font-weight:700;text-wrap:balance}
.dayhead .sub{color:var(--muted);font-size:13px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--good);transition:width .3s}
.banner{border-radius:var(--r);padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner b{color:var(--warn)}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-head{padding:12px 14px 8px;display:grid;gap:4px;border-left:4px solid var(--c,var(--acc))}
.ex[data-cat="squat"]{--c:var(--squat)} .ex[data-cat="bench"]{--c:var(--bench)} .ex[data-cat="dead"]{--c:var(--dead)} .ex[data-cat="acc"]{--c:var(--acc)}
.ex-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ord{font-family:var(--display);font-weight:600;color:var(--c);font-size:15px}
.ex h3{margin:0;font-size:17px;font-weight:700}
.ex .en{font-size:12px;color:var(--muted)}
.rx{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.rx .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.rx .big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}
.rx .meta{font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted)}
.rx .meta b{color:var(--ink)}
.note-pill{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.plates{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.plate{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 4px;border-radius:4px;font-family:var(--display);font-weight:700;font-size:13px;color:#fff}
.p25{background:#c9252b}.p20{background:#1d5fc4}.p15{background:#d6a800;color:#1a1400}.p10{background:#1d8a4b}.p5{background:#f2f2ee;color:#111;border:1px solid #bbb}.p2{background:#2b2d31}.p1{background:#8a8f94}
details.cue{padding:0 14px 6px}
details.cue summary{font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0;list-style:none}
details.cue summary::-webkit-details-marker{display:none}
details.cue summary::before{content:"＋ ";}
details.cue[open] summary::before{content:"－ ";}
details.cue p{margin:4px 0 6px;font-size:14px;max-width:62ch}

.sets{border-top:1px solid var(--line);background:var(--surface-2)}
.srow{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,.9fr) minmax(0,1fr) 44px;gap:6px;align-items:center;padding:6px 10px 6px 12px}
.srow + .srow{border-top:1px solid var(--line)}
.srow.hd{padding-block:5px;font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.srow .n{font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted);text-align:center}
.srow.opt .n::after{content:"選";display:block;font-size:9px;font-family:var(--body);font-weight:500;line-height:1}
.fld{position:relative}
.fld input,.fld select{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.fld input::placeholder{color:var(--muted);opacity:.55}
.fld .u{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.fld select{padding-right:4px;text-align:center}
.fld select.empty{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.chk{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.srow.done{background:var(--good-soft)}
.srow.done .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.srow.done .n{color:var(--good)}
.cancelled{padding:12px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 8px;font-size:16px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px;resize:vertical}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datein{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px}
.btn{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%;font-size:16px}
.btn.primary.is-done{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.sm{height:34px;font-size:13px;padding:0 12px;font-weight:600}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.timer .in{max-width:536px;margin:0 auto;pointer-events:auto;background:var(--ink);color:var(--surface);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px #0004}
.timer .t{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:74px}
.timer .lbl{flex:1;min-width:0;font-size:12px;opacity:.8;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{height:36px;border-radius:9px;border:1px solid color-mix(in srgb,var(--surface) 30%,transparent);background:transparent;color:inherit;font-weight:600;padding:0 10px;font-size:13px}
.timer.over .in{background:var(--accent);color:var(--accent-ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:58px}
.tab{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}
.grid8{display:grid;grid-template-columns:auto repeat(var(--n,8),minmax(26px,1fr));min-width:0;gap:4px;align-items:center;font-size:12px}
.grid8 .h{text-align:center;font-family:var(--display);font-weight:600;color:var(--muted);font-size:14px}
.grid8 .rl{color:var(--muted);font-family:var(--display);font-weight:600;font-size:14px;padding-right:4px}
.cell{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;color:var(--muted);padding:0}
.cell.part{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.cell.full{background:var(--good);border-color:var(--good);color:var(--surface)}
.cell.dl{border-style:dashed}
.lift{display:grid;gap:6px}
.lift + .lift{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.lift .top-l{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lift .name{font-weight:700;display:flex;align-items:center;gap:6px}
.lift .name i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.lift .val{font-family:var(--display);font-size:24px;font-weight:700}
.lift .val small{font-size:13px;color:var(--muted);font-weight:600}
.delta{font-family:var(--display);font-weight:600;font-size:15px}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--display);font-size:11px}
.hist{display:grid}
.hist button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist button:first-child{border-top:0}
.hist button:focus-visible{outline:2px solid var(--accent)}
.hist .wd{font-family:var(--display);font-weight:700;font-size:17px;min-width:62px}
.hist .s{font-size:13px;color:var(--muted)}
.hist .c{font-family:var(--display);font-weight:600}
.empty{color:var(--muted);font-size:14px;margin:0}

/* guide */
.prose p{margin:0 0 8px;max-width:62ch}
.tbl-wrap{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);letter-spacing:.05em;font-weight:600;white-space:nowrap}
td.n{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.work td{background:var(--accent-soft)}
.check{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.check b{display:block}
.redline{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.redline.hot{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* weight button + wheel picker */
.wbtn{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 22px 0 8px;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;text-align:left;display:flex;align-items:center;gap:4px}
.wbtn .ph{color:var(--muted);opacity:.55}
.wbtn::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
[hidden]{display:none!important}
.sheet-bg{position:absolute;inset:0;background:#0007}
.sheet-card{position:relative;background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;box-shadow:0 -8px 30px #0003}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head .t{flex:1;min-width:0;font-weight:700}
.sheet-head .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.wheel{position:relative;height:220px}
.wheel-hl{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);pointer-events:none}
.wheel-hl::after{content:attr(data-unit);position:absolute;right:calc(50% - 74px);top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);font-weight:600}
.wheel-list{position:relative;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:88px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel-list::-webkit-scrollbar{display:none}
.wi{height:44px;scroll-snap-align:center;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.wi.sel{color:var(--ink);font-size:32px;font-weight:700}
.wi.tgt:not(.sel)::after{content:"目標";font-family:var(--body);font-size:10px;margin-left:6px;color:var(--accent)}
.wi.tgt{display:flex;justify-content:center;align-items:center}
.pk-plates{min-height:22px;justify-content:center}
.pk-opts{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.pk-opts label{display:flex;align-items:center;gap:8px}
.pk-opts input{width:18px;height:18px;accent-color:var(--accent)}

/* trend chart */
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ctl select{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:2px solid var(--c)}
.legend i.dash{border-top:2px dashed var(--muted)}
.trend{position:relative}
.trend svg{touch-action:pan-y}
.trend .val-lbl{fill:var(--ink);font-weight:700;font-size:13px}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;pointer-events:none;white-space:nowrap;z-index:2}
.tip b{font-family:var(--display);font-size:16px}
details.tblv summary{font-size:13px;color:var(--muted);cursor:pointer;margin-top:8px}

/* menu editor */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 10px}
.f{display:grid;gap:4px;min-width:0}
.f > span:first-child{font-size:12px;color:var(--muted);font-weight:600}
.f.full{grid-column:1/-1}
.f select,.f input[type=text],.title-in,.en-in{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 10px;min-width:0}
.f textarea{min-height:70px}
.f.ck{display:flex;align-items:center;gap:8px;align-self:end;height:40px}
.f.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.f.ck span{font-size:13px}
.f .wbtn{background:var(--surface-2)}
.cyc{display:flex;flex-wrap:wrap;gap:4px}

<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><b id="nWeeks">8</b> 週健力日誌</h1>
      <span class="sync" id="sync"><i></i><span>本機儲存</span></span>
    </div>
    <div class="weeks" id="weeks" role="group" aria-label="選擇週次"></div>
    <div class="days" id="days" role="group" aria-label="選擇訓練日"></div>
  </div>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<div class="timer" id="timer" hidden>
  <div class="in">
    <span class="t" id="tTime">3:00</span>
    <span class="lbl" id="tLbl">組間休息</span>
    <button type="button" id="tMinus">−30</button>
    <button type="button" id="tPlus">+30</button>
    <button type="button" id="tStop">結束</button>
  </div>
</div>

<div class="sheet" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pkTitle">
  <div class="sheet-bg" data-pk-close></div>
  <div class="sheet-card">
    <div class="sheet-head">
      <span class="t" id="pkTitle">選擇重量</span>
      <button type="button" class="btn sm" id="pkClear">用目標值</button>
      <button type="button" class="btn sm" id="pkDone" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)">完成</button>
    </div>
    <div class="wheel"><div class="wheel-hl"></div><div class="wheel-list" id="pkList" tabindex="0" aria-label="重量滾輪，每格 2.5 kg"></div></div>
    <div class="plates pk-plates" id="pkPlates"></div>
    <div class="pk-opts"><label><input type="checkbox" id="pkAll">套用到後面未完成的組</label></div>
  </div>
</div>

<nav class="tabs" aria-label="主選單">
  <div class="wrap">
    <button class="tab" data-tab="log" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>訓練</button>
    <button class="tab" data-tab="prog" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>進度</button>
    <button class="tab" data-tab="menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h7M4 18h10"/><path d="M15.5 15.5l4-4 2 2-4 4H15.5z"/></svg>菜單</button>
    <button class="tab" data-tab="guide" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>指南</button>
  </div>
</nav>

<script>
(() => {
/* ---------- program: editable menu (defaults from Powerlifting_8Week_Cycle_Program.xlsx) ---------- */
const CATS = {squat:'深蹲', bench:'臥推', dead:'硬舉', acc:'輔助'};
const PARTS = {chest:'胸', back:'背', shoulder:'肩', legs:'腿', arms:'手臂'};
const PART_DEF = {row:'back', ohte:'arms', ohp:'shoulder', lc:'legs', lat:'back', lr:'shoulder', pd:'arms', crow:'back', fp:'shoulder'};
const SHEET_DEF = '1PDQZtUIER2I13lT0yUpd6xPeBLtTTwu7XuFyG15FfSY';
// part: squat / deadlift → legs, bench → chest, accessory → chosen by the user
function partOf(ex){ return ex.cat === 'squat' || ex.cat === 'dead' ? 'legs' : ex.cat === 'bench' ? 'chest' : (PARTS[ex.part] ? ex.part : 'back'); }
// tag: 1-4 reps per set = heavy, 5+ = hypertrophy
function tagOf(reps){ return reps != null && reps <= 4 ? 'heavy' : 'hyper'; }
const TAGS = {heavy:'大重量', hyper:'肌肉量'};
const LIFTS = {squat:'深蹲', bench:'臥推', dead:'硬舉'};
// e: [id, day, name, en, cat, bar, main, sets, opt, reps, repsMax, start, inc, rpe, rpeStep, dlSets, dlReps, dlPct, dlRpe, rest, wNote, cue]
const DEF_EX = [
  ['sq',1,'比賽深蹲','Comp Squat','squat',1,'squat',5,0,5,null,100,2.5,7.5,0.5,3,5,85,6,210,'','深度破水平，專注出坑剛性，每組確實保留 2-3 下餘力。組間休息 3-4 分鐘。'],
  ['bp1',1,'比賽臥推','Comp Pause Bench','bench',1,'bench',5,0,5,null,62.5,2.5,7.5,0.5,3,5,82.5,6,180,'','每下胸口停頓扎實 1 秒，腳掌踩實地面維持全身張力，手肘不外炸。'],
  ['row',1,'胸部支撐划船','機台 / 啞鈴','acc',0,'',4,0,8,10,40,0,8,0,2,8,100,7,90,'40–42.5 kg','胸部緊貼靠墊，完全卸除下背負擔，拉至頂峰夾緊肩胛骨 1 秒。'],
  ['ohte',1,'過頭三頭伸展','啞鈴 / 滑輪','acc',0,'',3,0,10,12,10,0,8,0,2,10,100,7,90,'啞鈴 10–12 kg','手肘朝前不外炸，控制離心下放 2 秒，充分拉長三頭肌長頭。'],
  ['dl',2,'比賽硬舉','Top Sets 強度組','dead',1,'dead',2,0,3,null,150,5,7.5,0.5,1,3,85,6,240,'','起槓前拉緊虛位 (Slack Out)，背闊肌鎖死，專注離地爆發力。'],
  ['pdl',2,'暫停硬舉','Back-off 技術組','dead',1,'',2,0,3,null,120,5,7,0.5,0,3,85,6,180,'','離地 2-3 cm 確實停頓 1.5-2 秒，保持足中重心與脊椎中立。'],
  ['ohp',2,'站姿槓鈴肩推','Strict OHP','acc',1,'',3,1,8,null,35,2.5,7.5,0.5,2,6,77.5,6,150,'','站姿嚴格推，核心與臀部收緊，過頭後頭微前收完全鎖死，控制離心下放。'],
  ['lc',2,'坐姿機械腿後彎舉','Leg Curl','acc',0,'',3,0,10,12,22.5,0,8,0,2,10,100,7,90,'機台 23 kg','向後勾到底頂峰擠壓 1 秒，離心控制 2 秒回位，提供後鏈膝屈且零脊椎負載。'],
  ['bps',3,'比賽臥推 頂尖單下','Top Single','bench',1,'bench',1,0,1,null,75,2.5,8,0,1,1,87.5,6,240,'','全範圍胸口停頓 1 秒，感受高速推進，建立大重量神經適應。'],
  ['bpw',3,'比賽臥推 工作組','Working Sets','bench',1,'bench',3,0,3,null,67.5,2.5,7.5,0.5,2,3,82.5,6,180,'','每下確實停頓，維持推力爆發力與軌跡一致性。'],
  ['lat',3,'滑輪下拉 / 引體向上','Lat Pulldown / Pull-up','acc',0,'',4,0,8,10,null,0,8,0,2,8,100,7,90,'體感 RPE 8','肩胛下壓啟動，打造支撐臥推的堅固背部平台。'],
  ['lr',3,'啞鈴側平舉','Lateral Raise','acc',0,'',3,0,12,15,7.5,0,8,0,2,12,100,7,75,'7–8 kg','軀幹微前傾、不借力聳肩，離心慢放，強化三角肌中束。'],
  ['pd',3,'繩索三頭下壓','Pushdown','acc',0,'',3,0,10,12,null,0,8,0,2,10,100,7,75,'體感 RPE 8','直槓 / V 把，大臂夾緊身體兩側，底部完全鎖死手肘擠壓 1 秒。'],
  ['psq',4,'暫停深蹲','2-Sec Pause Squat','squat',1,'',3,0,3,null,87.5,2.5,7,0.5,2,3,80,6,180,'','底部靜止默數滿 2 秒，消除牽張反射，軀幹不放鬆，專注出坑張力。'],
  ['hbp',4,'半程臥推','板推 / 架上推','bench',1,'',4,0,4,5,70,2.5,7.5,0.5,2,5,80,6,180,'','高度設在卡關點（離胸 8-10 cm），停頓 0.5 秒後靠三頭肌爆發力蹬直鎖定。'],
  ['crow',4,'坐姿滑輪水平划船','Cable Row','acc',0,'',3,0,10,12,40,0,8,0,2,10,100,7,90,'40–45 kg','窄握 / 對握貼身拉，頂峰肩胛骨後收夾緊 1 秒，強化臥推起槓穩定。'],
  ['fp',4,'繩索面拉','Face Pull','acc',0,'',3,0,15,null,15,0,8,0,2,15,100,7,75,'15–20 kg','對準面部高度，大拇指朝後拉至雙耳旁，保養肩袖與後三角肌。']
];
const EX_KEYS = ['id','day','name','en','cat','bar','main','sets','opt','reps','repsMax','start','inc','rpe','rpeStep','dlSets','dlReps','dlPct','dlRpe','rest','wNote','cue'];
const BLANK_EX = {day:1,name:'新動作',en:'',cat:'acc',part:'back',bar:false,main:'',sets:3,opt:0,reps:10,repsMax:null,start:null,inc:0,rpe:8,rpeStep:0,dlSets:2,dlReps:10,dlPct:100,dlRpe:7,rest:90,wNote:'',cue:''};
function defaultProgram(){
  return {
    cycle:{accum:3, deload:1, waves:2, shift:1},
    days:{1:{title:'下肢與上肢容量日',en:'Volume Day'},2:{title:'硬舉強度日',en:'Deadlift & Strict Press'},3:{title:'上肢強度日',en:'Bench Intensity & Back'},4:{title:'技術與弱點強化日',en:'Squat Pause & Bench Lockout'}},
    base:{squat:{w:100,r:5,rpe:7.5},bench:{w:82.5,r:1,rpe:10},dead:{w:180,r:1,rpe:9}},
    sheetId:SHEET_DEF, schema:3,
    exercises:DEF_EX.map(a => { const o = Object.fromEntries(EX_KEYS.map((k,i) => [k, a[i]])); o.bar = !!o.bar; o.part = PART_DEF[o.id] || partOf(o); return o; })
  };
}
function normalizeProgram(p){
  const d = defaultProgram();
  if (!p || !Array.isArray(p.exercises)) return d;
  return {
    cycle:Object.assign({}, d.cycle, p.cycle),
    days:Object.assign({}, d.days, p.days),
    base:Object.assign({}, d.base, p.base),
    sheetId:p.sheetId ?? SHEET_DEF, schema:3,
    exercises:p.exercises.filter(e => e && e.id).map(e => {
      const o = Object.assign({}, BLANK_EX, e);
      if (!p.schema){ if (o.id === 'ohp' && o.cat === 'bench') o.cat = 'acc'; if (!e.part) o.part = PART_DEF[o.id] || 'back'; }
      if ((p.schema || 0) < 3 && (o.id === 'ohte' || o.id === 'pd') && o.part === 'chest') o.part = 'arms';
      return o; }),
    updatedAt:p.updatedAt || 0
  };
}

let prog, WEEKS, DAYS, EX, EXBY, BASE, E1_LIFTS, TOTAL_WEEKS;
function rebuild(){
  const C = prog.cycle, len = C.accum + C.deload;
  TOTAL_WEEKS = len * C.waves;
  WEEKS = Array.from({length:TOTAL_WEEKS}, (_, k) => {
    const wave = Math.floor(k / len), pos = k % len, deload = pos >= C.accum;
    const wv = C.waves > 1 ? `波${wave+1} ` : '';
    return {n:k+1, wave, pos, deload, label: deload ? `${wv}減量` : `${wv}累積${pos+1}`};
  });
  DAYS = prog.days;
  EX = prog.exercises;
  const counter = {};
  EX.forEach(e => { counter[e.day] = (counter[e.day] || 0) + 1; e.ord = String(counter[e.day]); });
  EXBY = Object.fromEntries(EX.map(e => [e.id, e]));
  BASE = {};
  for (const l in LIFTS){ const b = prog.base[l]; BASE[l] = {label:LIFTS[l], e1:e1rm(b.w, b.r, b.rpe), src:`${fmt(b.w)} kg × ${b.r} @ ${fmt(b.rpe)}`}; }
  E1_LIFTS = {squat:[], bench:[], dead:[]};
  EX.forEach(e => { if (E1_LIFTS[e.main]) E1_LIFTS[e.main].push(e.id); });
  if (ui.week > TOTAL_WEEKS) ui.week = TOTAL_WEEKS;
}

function firstNum(v){ const m = String(v ?? '').match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function e1rm(w, reps, rpe){ const n = reps + (10 - rpe); return n <= 1 ? w : w * (1 + n / 30); }
function fmt(n){ return (Math.round(n * 100) / 100).toString(); }
function r25(v){ return Math.round(v / 2.5) * 2.5; }
function weekInfo(week){
  const C = prog.cycle, len = C.accum + C.deload, k = week - 1;
  return {wave:Math.floor(k / len), pos:k % len, deload:(k % len) >= C.accum};
}

// prescription for an exercise in a given week, computed from the menu
function rx(ex, week){
  const C = prog.cycle, wi = weekInfo(week), hasW = ex.start != null && ex.start !== '';
  if (wi.deload){
    if (!ex.dlSets) return {cancelled:true};
    const last = hasW ? ex.start + (wi.wave * C.shift + C.accum - 1) * ex.inc : null;
    const w = last == null ? null : r25(last * ex.dlPct / 100);
    return {w, wText:w == null ? (ex.wNote || '自訂重量') : fmt(w), rows:ex.dlSets, optFrom:null, setsText:String(ex.dlSets),
      reps:ex.dlReps, repsText:String(ex.dlReps), rpe:fmt(ex.dlRpe), note:'減量週', deload:true};
  }
  const steps = wi.wave * C.shift + wi.pos;
  const w = hasW ? r25(ex.start + steps * ex.inc) : null;
  const opt = ex.opt || 0;
  return {w, wText:w == null ? (ex.wNote || '自訂重量') : fmt(w), rows:ex.sets + opt, optFrom:opt ? ex.sets : null,
    setsText:opt ? `${ex.sets}-${ex.sets + opt}` : String(ex.sets), reps:ex.reps, repsText:ex.repsMax ? `${ex.reps}-${ex.repsMax}` : String(ex.reps),
    rpe:fmt(Math.min(10, ex.rpe + wi.pos * ex.rpeStep)), note:null};
}
function exercisesFor(day){ return EX.filter(e => e.day === day); }

/* ---------- state ---------- */
const LS_KEY = 'pl8.sessions.v1', LS_UI = 'pl8.ui.v1', LS_CNS = 'pl8.cns.v1';
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

let sessions = lsGet(LS_KEY, {});
const ui = Object.assign({week:1, day:1, tab:'log'}, lsGet(LS_UI, {}));
const LS_PROG = 'pl8.program.v1';
prog = normalizeProgram(lsGet(LS_PROG, null));
rebuild();
const openEx = new Set();
let resetArm = false, delArm = null;
let cns = lsGet(LS_CNS, {});
const key = (w, d) => `w${w}d${d}`;
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

function getSession(w, d){ return sessions[key(w,d)] || null; }
function ensureSession(w, d){
  const k = key(w, d);
  if (!sessions[k]) sessions[k] = {week:w, day:d, date:null, done:false, note:'', sets:{}};
  return sessions[k];
}
function setRow(s, exId, i){
  s.sets[exId] = s.sets[exId] || [];
  while (s.sets[exId].length <= i) s.sets[exId].push({w:'', r:'', rpe:'', ok:false});
  return s.sets[exId][i];
}
function dayCounts(w, d){
  const s = getSession(w, d); let total = 0, done = 0;
  for (const ex of exercisesFor(d)){
    const p = rx(ex, w); if (p.cancelled) continue;
    const req = p.optFrom ?? p.rows; total += req;
    const arr = s?.sets?.[ex.id] || [];
    done += Math.min(req, arr.filter(x => x.ok).length);
  }
  return {total, done, finished: !!s?.done};
}

/* ---------- persistence: cloud (db, private per person) with local cache ---------- */
let col = null, cloudOn = false;
const dirty = new Set(), inflight = new Set();
let saveTimer = null;
function touch(k){
  sessions[k].updatedAt = Date.now();
  lsSet(LS_KEY, sessions);
  markSheetDirty();
  dirty.add(k);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
function touchProg(){
  prog.updatedAt = Date.now();
  lsSet(LS_PROG, prog);
  markSheetDirty();
  dirty.add('program');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
const bodyFor = k => JSON.parse(JSON.stringify(k === 'program' ? prog : sessions[k]));
async function flush(){
  if (!cloudOn) { dirty.clear(); return; }
  for (const k of [...dirty]){
    if (inflight.has(k)) continue;
    dirty.delete(k); inflight.add(k);
    try { await col.doc(k).set(bodyFor(k)); }
    catch (e) {
      if (e && e.code === 'unavailable') { dirty.add(k); setTimeout(flush, 1500 + Math.random()*1500); }
      else if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { setSync(false, '雲端無法寫入，改存本機'); cloudOn = false; }
      else if (e && e.code === 'quota_exceeded') { setSync(false, '雲端空間已滿'); }
    }
    finally { inflight.delete(k); }
  }
  if (dirty.size) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
}
function setSync(on, text){
  const el = document.getElementById('sync');
  el.classList.toggle('on', on);
  el.querySelector('span').textContent = text;
}
let pendingRender = false;
function typing(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && document.getElementById('view').contains(a); }
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; render(); } }, 50));

/* ---------- rest timer ---------- */
let tEnd = 0, tTick = null, tLabel = '';
const tEl = document.getElementById('timer');
function startTimer(sec, label){
  tEnd = Date.now() + sec*1000; tLabel = label;
  tEl.hidden = false; tEl.classList.remove('over');
  clearInterval(tTick); tTick = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer(){
  const left = Math.round((tEnd - Date.now())/1000);
  const a = Math.abs(left), txt = `${left < 0 ? '+' : ''}${Math.floor(a/60)}:${String(a%60).padStart(2,'0')}`;
  document.getElementById('tTime').textContent = txt;
  document.getElementById('tLbl').textContent = left < 0 ? '休息結束，下一組' : tLabel;
  if (left <= 0 && !tEl.classList.contains('over')){ tEl.classList.add('over'); try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch {} }
}
document.getElementById('tMinus').onclick = () => { tEnd -= 30000; tEl.classList.remove('over'); tickTimer(); };
document.getElementById('tPlus').onclick = () => { tEnd += 30000; tEl.classList.remove('over'); tickTimer(); };
document.getElementById('tStop').onclick = () => { clearInterval(tTick); tEl.hidden = true; };

/* ---------- rendering ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const RPES = ['6','6.5','7','7.5','8','8.5','9','9.5','10'];

function plates(total){
  if (!total || total < 20) return '';
  let side = (total - 20) / 2; const out = [];
  for (const p of [25,20,15,10,5,2.5,1.25]) while (side >= p - 1e-9){ out.push(p); side -= p; }
  if (!out.length) return '<span>空槓 20 kg</span>';
  const cls = p => p >= 25 ? 'p25' : p >= 20 ? 'p20' : p >= 15 ? 'p15' : p >= 10 ? 'p10' : p >= 5 ? 'p5' : p >= 2.5 ? 'p2' : 'p1';
  return '<span>每邊</span>' + out.map(p => `<span class="plate ${cls(p)}">${fmt(p)}</span>`).join('') + (side > 0.01 ? `<span>+${fmt(side)}</span>` : '');
}

function weekBest(){
  // best e1RM per lift per week from completed sets
  const res = {squat:Array(TOTAL_WEEKS).fill(null), bench:Array(TOTAL_WEEKS).fill(null), dead:Array(TOTAL_WEEKS).fill(null)};
  for (const k in sessions){
    const s = sessions[k]; if (!s || !s.sets || s.week > TOTAL_WEEKS) continue;
    for (const lift in E1_LIFTS){
      for (const id of E1_LIFTS[lift]){
        const ex = EXBY[id], p = rx(ex, s.week);
        for (const r of s.sets[id] || []){
          if (!r.ok) continue;
          const w = firstNum(r.w) ?? p.w, reps = firstNum(r.r) ?? p.reps, rpe = firstNum(r.rpe) ?? firstNum(p.rpe);
          if (!w || !reps || !rpe) continue;
          const v = e1rm(w, reps, Math.min(10, rpe));
          if (res[lift][s.week-1] == null || v > res[lift][s.week-1]) res[lift][s.week-1] = v;
        }
      }
    }
  }
  return res;
}

function liftChart(vals, base, color){
  const W = 320, H = 96, L = 30, R = 8, T = 10, B = 20;
  const pts = vals.map((v,i) => v == null ? null : [i, v]).filter(Boolean);
  const all = pts.map(p => p[1]).concat(base);
  let lo = Math.floor((Math.min(...all) - 3) / 5) * 5, hi = Math.ceil((Math.max(...all) + 3) / 5) * 5;
  if (hi - lo < 10) hi = lo + 10;
  const N = vals.length, x = i => L + i * (W - L - R) / Math.max(1, N - 1), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = `<line x1="${L}" x2="${W-R}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/>`;
  g += `<text x="${L-6}" y="${y(hi)+4}" text-anchor="end">${hi}</text><text x="${L-6}" y="${y(lo)+4}" text-anchor="end">${lo}</text>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  g += `<text x="${W-R}" y="${y(base)-4}" text-anchor="end">基準 ${fmt(base)}</text>`;
  const every = Math.ceil(N / 10);
  for (let i = 0; i < N; i++) if (i % every === 0 || i === N - 1) g += `<text x="${x(i)}" y="${H-4}" text-anchor="middle">W${i+1}</text>`;
  if (pts.length > 1) g += `<polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => `${x(p[0])},${y(p[1])}`).join(' ')}"/>`;
  pts.forEach((p, j) => { g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${j === pts.length-1 ? 4.5 : 3}" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每週最佳估算 1RM">${g}</svg>`;
}

function renderProg(){
  let doneDays = 0, setsDone = 0, tonnage = 0;
  for (let w = 1; w <= TOTAL_WEEKS; w++) for (let d = 1; d <= 4; d++) if (dayCounts(w,d).finished) doneDays++;
  for (const k in sessions){
    const s = sessions[k];
    for (const id in (s.sets || {})){
      const ex = EXBY[id]; if (!ex) continue; const p = rx(ex, s.week);
      for (const r of s.sets[id]) if (r.ok){ setsDone++; const w = firstNum(r.w) ?? p.w, reps = firstNum(r.r) ?? p.reps; if (w && reps) tonnage += w * reps; }
    }
  }
  let h = `<div class="dayhead"><span class="eyebrow">${TOTAL_WEEKS} 週週期進度</span><h2>訓練進度</h2></div>

  <div class="stats">
    <div class="stat"><div class="k">完成訓練日</div><div class="v">${doneDays}<small> / ${TOTAL_WEEKS * 4}</small></div></div>
    <div class="stat"><div class="k">完成組數</div><div class="v">${setsDone}</div></div>
    <div class="stat"><div class="k">總訓練量</div><div class="v">${tonnage >= 1000 ? fmt(tonnage/1000) + '<small> t</small>' : Math.round(tonnage) + '<small> kg</small>'}</div></div>
  </div>
  <div class="card"><h3>出席表</h3><div class="tbl-wrap"><div class="grid8" style="--n:${TOTAL_WEEKS}"><span></span>${WEEKS.map(w => `<span class="h">W${w.n}</span>`).join('')}`;
  for (let d = 1; d <= 4; d++){
    h += `<span class="rl">D${d}</span>`;
    for (let w = 1; w <= TOTAL_WEEKS; w++){
      const c = dayCounts(w, d), cls = c.finished ? 'full' : c.done ? 'part' : '';
      h += `<button type="button" class="cell ${cls}${WEEKS[w-1].deload?' dl':''}" data-go="${w}-${d}" aria-label="第 ${w} 週 Day ${d}">${c.finished ? '✓' : c.done ? c.done : ''}</button>`;
    }
  }
  h += `</div></div><p class="small muted" style="margin:8px 0 0">綠色＝已完成，橘色數字＝已做組數，虛線框＝減量週。點格子跳到該日。</p></div>`;

  h += renderTrend();

  const best = weekBest();
  h += `<div class="card"><h3>估算 1RM 走勢</h3><p class="small muted" style="margin:0 0 10px">以完成組的重量 × 次數 + 保留次數（10 − RPE）推算，每週取最佳。未填的欄位用課表目標值。</p>`;
  const colors = {squat:'var(--squat)', bench:'var(--bench)', dead:'var(--dead)'};
  for (const lift of ['squat','bench','dead']){
    if (!E1_LIFTS[lift].length) continue;
    const vals = best[lift], b = BASE[lift], last = [...vals].reverse().find(v => v != null);
    const dlt = last != null ? last - b.e1 : null;
    h += `<div class="lift" style="--c:${colors[lift]}"><div class="top-l"><span class="name"><i></i>${b.label}</span>
      <span>${last != null ? `<span class="val">${fmt(last)}<small> kg</small></span> <span class="delta ${dlt >= 0 ? 'up' : 'down'}">${dlt >= 0 ? '+' : ''}${fmt(dlt)}</span>` : `<span class="small muted">尚無紀錄</span>`}</span></div>
      ${liftChart(vals, b.e1, colors[lift])}
      <span class="small muted">基準：${b.src}</span></div>`;
  }
  h += `</div>`;

  const list = Object.values(sessions).filter(s => DAYS[s.day] && Object.values(s.sets || {}).some(a => a.some(r => r.ok)) || s.done)
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.week*10+b.day) - (a.week*10+a.day));
  h += `<div class="card"><h3>訓練紀錄</h3>`;
  if (!list.length) h += `<p class="empty">還沒有紀錄。在「訓練」頁勾選完成的組，紀錄就會出現在這裡。</p>`;
  else h += `<div class="hist">` + list.map(s => { const c = dayCounts(s.week, s.day);
      return `<button type="button" data-go="${s.week}-${s.day}"><span class="wd">W${s.week} · D${s.day}</span><span class="s">${esc(DAYS[s.day].title)}${s.date ? ` · ${s.date.slice(5).replace('-','/')}` : ''}${s.note ? ' · 有筆記' : ''}</span><span class="c">${c.finished ? '✓ ' : ''}${c.done}/${c.total}</span></button>`; }).join('') + `</div>`;
  h += `</div>`;
  return h;
}

/* ---------- weight over time (line chart) ---------- */
const CAT_COLOR = {squat:'var(--squat)', bench:'var(--bench)', dead:'var(--dead)', acc:'var(--accent)'};
let trendPts = [], trendGeo = null;
function trendData(exId){
  const ex = EXBY[exId], out = [];
  for (const k in sessions){
    const s = sessions[k]; if (!s || !s.date || !s.sets?.[exId]) continue;
    const p = rx(ex, s.week);
    let top = null, reps = null;
    for (const r of (s.sets?.[exId] || [])){
      if (!r.ok) continue;
      const w = firstNum(r.w) ?? p.w; if (w == null) continue;
      if (top == null || w > top){ top = w; reps = firstNum(r.r) ?? p.reps; }
    }
    if (top == null) continue;
    out.push({t:Date.parse(s.date + 'T00:00:00'), date:s.date, week:s.week, day:s.day, top, reps, plan:p.w});
  }
  return out.sort((a, b) => a.t - b.t);
}
function renderTrend(){
  const exId = EXBY[ui.chartEx] ? ui.chartEx : (EX[0]?.id), ex = EXBY[exId], color = CAT_COLOR[ex.cat];
  const opts = [1,2,3,4].map(d => `<optgroup label="Day ${d}">${exercisesFor(d).map(e => `<option value="${e.id}"${e.id===exId?' selected':''}>${e.name}</option>`).join('')}</optgroup>`).join('');
  trendGeo = null; trendPts = exId ? trendData(exId) : [];
  if (!exId) return `<div class="card"><h3>重量趨勢</h3><p class="empty">菜單裡還沒有動作。</p></div>`;
  let h = `<div class="card"><h3>重量趨勢</h3>
    <div class="ctl"><select id="chartEx" aria-label="選擇動作">${opts}</select></div>`;
  if (!trendPts.length){
    return h + `<p class="empty">這個動作還沒有紀錄。勾選完成的組後，這裡會依訓練日期畫出每次的最高重量。</p></div>`;
  }
  const W = 340, H = 210, L = 38, R = 16, T = 22, B = 26;
  const vals = trendPts.flatMap(p => p.plan != null ? [p.top, p.plan] : [p.top]);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  const step = [2.5,5,10,20,25,50].find(s => (Math.ceil(mx/s) - Math.floor(mn/s)) <= 4) || 50;
  let lo = Math.floor(mn/step)*step, hi = Math.ceil(mx/step)*step;
  if (hi - lo < step*2){ lo -= step; hi += step; }
  if (lo < 0) lo = 0;
  let t0 = trendPts[0].t, t1 = trendPts[trendPts.length-1].t;
  if (t1 - t0 < 864e5*6){ const mid = (t0+t1)/2; t0 = mid - 864e5*3; t1 = mid + 864e5*3; }
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  trendGeo = {W, L, R, T, B, H, x, y, color};
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step){
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const n = trendPts.length, idxs = [...new Set(n <= 4 ? trendPts.map((_,i) => i) : [0, Math.round((n-1)/3), Math.round(2*(n-1)/3), n-1])];
  for (const i of idxs){ const p = trendPts[i], [, m, d] = p.date.split('-'); g += `<text x="${x(p.t)}" y="${H-6}" text-anchor="middle">${+m}/${+d}</text>`; }
  const plan = trendPts.filter(p => p.plan != null);
  if (plan.length > 1) g += `<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" points="${plan.map(p => `${x(p.t)},${y(p.plan)}`).join(' ')}"/>`;
  else if (plan.length === 1) g += `<circle cx="${x(plan[0].t)}" cy="${y(plan[0].plan)}" r="3" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  if (n > 1) g += `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${trendPts.map(p => `${x(p.t)},${y(p.top)}`).join(' ')}"/>`;
  g += `<line id="tx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  trendPts.forEach((p, i) => { g += `<circle data-pt="${i}" cx="${x(p.t)}" cy="${y(p.top)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`; });
  const last = trendPts[n-1];
  g += `<text class="val-lbl" x="${Math.min(x(last.t), W-R)}" y="${y(last.top)-10}" text-anchor="${x(last.t) > W-60 ? 'end' : 'middle'}">${fmt(last.top)}</text>`;
  h += `<div class="legend"><span style="--c:${color}"><i></i>實際最高重量</span><span><i class="dash"></i>課表目標</span></div>
    <div class="trend"><svg class="chart" id="trendSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ex.name} 重量隨時間變化">${g}</svg><div class="tip" id="tip" hidden></div></div>
    <details class="tblv"><summary>數據表</summary><div class="tbl-wrap"><table><thead><tr><th>日期</th><th>週 / 日</th><th>最高重量</th><th>次數</th><th>目標</th></tr></thead><tbody>
    ${trendPts.slice().reverse().map(p => `<tr><td>${p.date}</td><td>W${p.week} D${p.day}</td><td class="n">${fmt(p.top)}</td><td>${p.reps ?? ''}</td><td>${p.plan != null ? fmt(p.plan) : '—'}</td></tr>`).join('')}
    </tbody></table></div></details></div>`;
  return h;
}
function bindTrend(){
  const svg = document.getElementById('trendSvg'); if (!svg || !trendGeo) return;
  const tip = document.getElementById('tip'), cross = svg.querySelector('#tx');
  const show = ev => {
    const rect = svg.getBoundingClientRect(), vx = (ev.clientX - rect.left) / rect.width * trendGeo.W;
    let best = 0, bd = Infinity;
    trendPts.forEach((p, i) => { const d = Math.abs(trendGeo.x(p.t) - vx); if (d < bd){ bd = d; best = i; } });
    const p = trendPts[best], px = trendGeo.x(p.t);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    svg.querySelectorAll('[data-pt]').forEach(c => c.setAttribute('r', +c.dataset.pt === best ? 6 : 4));
    tip.hidden = false;
    tip.innerHTML = `${p.date.slice(5).replace('-','/')} · W${p.week} D${p.day}<br><b>${fmt(p.top)} kg</b>${p.reps ? ` × ${p.reps}` : ''}${p.plan != null ? `<br>目標 ${fmt(p.plan)} kg` : ''}`;
    const left = px / trendGeo.W * rect.width, half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(rect.width - half, left)) + 'px';
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse'){ tip.hidden = true; cross.setAttribute('visibility','hidden'); svg.querySelectorAll('[data-pt]').forEach(c => c.setAttribute('r', 4)); } });
}

const pk = {el:document.getElementById('picker'), list:document.getElementById('pkList'), ex:null, i:0, idx:0, mode:null, vals:[]};

function pkSelect(k){

/* ---------- cycle overview (menu top) ---------- */
function peakOf(ex){
  let best = null;
  for (const wk of WEEKS){ const p = rx(ex, wk.n); if (p.cancelled || p.w == null) continue; if (!best || p.w > best.w) best = {w:p.w, reps:p.reps, week:wk.n}; }
  return best;
}
function primaryLift(l){
  const cands = EX.filter(e => e.cat === l && e.start != null);
  const pool = cands.some(e => e.main === l) ? cands.filter(e => e.main === l) : cands;
  let best = null;
  for (const e of pool){ const pk = peakOf(e); if (pk && (!best || pk.w > best.pk.w)) best = {ex:e, pk}; }
  return best;
}

/* ---------- weekly training volume ---------- */
function volumeOf(week){
  const lifts = {squat:{heavy:[0,0], hyper:[0,0]}, bench:{heavy:[0,0], hyper:[0,0]}, dead:{heavy:[0,0], hyper:[0,0]}};
  const acc = Object.fromEntries(Object.keys(PARTS).map(k => [k, [0,0]]));
  for (const ex of EX){
    const p = rx(ex, week); if (p.cancelled) continue;
    const plan = p.optFrom ?? p.rows;
    const done = Math.min(p.rows, (getSession(week, ex.day)?.sets?.[ex.id] || []).filter(r => r.ok).length);
    const cell = lifts[ex.cat] ? lifts[ex.cat][tagOf(p.reps)] : acc[partOf(ex)];
    cell[0] += done; cell[1] += plan;
  }
  return {lifts, acc};
}
const sum2 = (x, y) => [x[0] + y[0], x[1] + y[1]];
function volPick(v, kind, a, b){
  if (kind === 'lift'){ const L = v.lifts[a]; return b === 'all' ? sum2(L.heavy, L.hyper) : L[b]; }
  if (kind === 'sum'){ const pick = t => Object.keys(LIFTS).reduce((acc, l) => sum2(acc, v.lifts[l][t]), [0,0]); return a === 'all' ? sum2(pick('heavy'), pick('hyper')) : pick(a); }
  return v.acc[a];
}
// per-exercise sets for one week: [done, planned]
function volItems(week){
  const out = {};
  for (const ex of EX){
    const p = rx(ex, week); if (p.cancelled) continue;
    const done = Math.min(p.rows, (getSession(week, ex.day)?.sets?.[ex.id] || []).filter(r => r.ok).length);
    out[ex.id] = {ex, p, x:[done, p.optFrom ?? p.rows]};
  }
  return out;
}
const volPart = {};   // card → expanded accessory part
const CAT_ORDER = ['squat', 'bench', 'dead', 'acc'];
// o: {ctx, title, hint, week, dlWeek, withDone}
function renderVolCard(o){

  const cell = (kind, a, b) => num(volPick(va, kind, a, b), vd && volPick(vd, kind, a, b));
  const mode = ui.volMode === 'day' ? 'day' : 'part';
  let h = `<div class="card"><div class="vhead"><h3>${o.title}</h3>

    const open = volPart[o.ctx];

      ${Object.keys(PARTS).map(k => `<button type="button" class="ovc" data-volpart="${k}" data-ctx="${o.ctx}" aria-expanded="${open === k}">${cell('part', k)}</button>`).join('')}</div>`;
    if (open && PARTS[open]){

    const sumFor = (items, d, match) => items ? Object.values(items).filter(it => it.ex.day === d && match(it.ex)).reduce((a, it) => sum2(a, it.x), [0,0]) : null;
    const cellHTML = (d, match, color) => {

      }

    };
    h += `<div class="vgrid"><span></span>${[1,2,3,4].map(d => `<span class="h">D${d}</span>`).join('')}`;
    rowsDef.forEach((r, i) => {
      if (i === 3) h += `<span class="vsep">輔助</span>`;
      h += `<span class="rl"><i style="background:${r.color}"></i>${r.label}</span>${[1,2,3,4].map(d => cellHTML(d, r.match, r.color)).join('')}`;
    });
    h += `<span class="rl tot">合計</span>${[1,2,3,4].map(d => cellHTML(d, () => true, 'var(--ink)')).join('')}</div>
      <p class="small muted" style="margin:8px 0 0">${o.withDone ? '格子內為已完成 / 計畫組數；綠色＝做完，橘色＝做了一部分。' : `格子內為該天的組數${id ? '，小字為減量週' : ''}。空白＝這天沒有練。`}</p>`;
  }
  return h + `</div>`;
}

function markSheetDirty(){
  lsSet(PENDING_KEY, 1);
  clearTimeout(autoTimer);
  if (getHook()) autoTimer = setTimeout(() => syncSheet(true), 20000);

function updateBadge(){
  const pending = !!lsGet(PENDING_KEY, 0), online = navigator.onLine;
  if (!getHook()) setSync(false, online ? '尚未連結試算表' : '離線');
  else if (sheetStatus.state === 'busy') setSync(true, '同步中…');
  else if (!online) setSync(false, pending ? '離線 · 待同步' : '離線');
  else setSync(!pending, pending ? '待同步' : '已同步');
}

function sheetRows(){
  const list = Object.values(sessions).filter(s => s && s.sets).sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || (a.week*10+a.day) - (b.week*10+b.day));
  const sets = [['日期','週','Day','訓練日','動作','類別','部位','標籤','組','重量(kg)','次數','RPE','目標重量','目標次數','目標RPE','估算1RM']];
  const days = [['日期','週','Day','訓練日','週期階段','完成組數','計畫組數','已完成','筆記']];
  for (const s of list){
    let any = false;
    for (const id in s.sets){
      const ex = EXBY[id], p = ex ? rx(ex, s.week) : {};
      s.sets[id].forEach((r, i) => {
        if (!r.ok) return; any = true;
        const w = firstNum(r.w) ?? p.w ?? '', reps = firstNum(r.r) ?? p.reps ?? '', rpe = firstNum(r.rpe);
        const est = w !== '' && reps !== '' ? Math.round(e1rm(w, reps, Math.min(10, rpe ?? firstNum(p.rpe) ?? 10)) * 10) / 10 : '';
        sets.push([s.date || '', s.week, s.day, DAYS[s.day]?.title || '', ex ? ex.name : '（已刪除的動作）', ex ? CATS[ex.cat] : '', ex ? PARTS[partOf(ex)] : '',
          TAGS[tagOf(reps === '' ? null : reps)], i + 1, w, reps, rpe ?? '', p.w ?? '', p.reps ?? '', p.rpe ? +p.rpe : '', est]);
      });
    }
    if (any || s.done){ const c = dayCounts(s.week, s.day);
      days.push([s.date || '', s.week, s.day, DAYS[s.day]?.title || '', WEEKS[s.week-1]?.label || '', c.done, c.total, s.done ? '是' : '否', s.note || '']); }
  }
  return {sets, days};
}
// full backup (records + menu) as text chunks, so the offline app can restore from the sheet
function backupRows(){
  const json = JSON.stringify({v:1, at:Date.now(), sessions, prog, cns});
  const rows = [[new Date().toISOString()]];
  for (let i = 0; i < json.length; i += 40000) rows.push([json.slice(i, i + 40000)]);
  return rows;
}
async function syncSheet(auto){
  const hook = getHook();
  if (!hook || sheetStatus.state === 'busy') return;
  if (!navigator.onLine){ sheetStatus = {state:'idle', msg:'', at:sheetStatus.at}; updateBadge(); if (ui.tab === 'prog' && !typing()) render(); return; }
  clearTimeout(autoTimer);
  sheetStatus = {state:'busy', msg:'', at:sheetStatus.at}; updateBadge(); if (ui.tab === 'prog' && !typing()) render();
  const {sets, days} = sheetRows();
  const body = JSON.stringify({sets, days, backup:backupRows()});
  try {
    const res = await fetch(hook, {method:'POST', body, headers:{'Content-Type':'text/plain;charset=utf-8'}});
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || !out.ok) throw new Error(out && out.error || 'bad');
    lsSet(PENDING_KEY, 0); lsSet('pl8.sheetAt', Date.now());
    sheetStatus = {state:'ok', msg:'', at:Date.now()};
  } catch (e){
    sheetStatus = {state:'err', at:sheetStatus.at, msg:(auto ? '自動同步沒有完成：' : '') + (navigator.onLine
      ? '連不上試算表。請確認網址正確，且 Apps Script 部署的存取權是「所有人」。' : '目前離線，連上網路後會自動同步。')};
  }
  updateBadge();
  if (ui.tab === 'prog'){ if (typing()) pendingRender = true; else render(); }
}
async function restoreFromSheet(){
  const hook = getHook(); if (!hook) return;
  sheetStatus = {state:'busy', msg:'', at:sheetStatus.at}; render();
  try {
    const res = await fetch(hook + (hook.includes('?') ? '&' : '?') + 'action=backup');
    const out = await res.json();
    if (!out || !out.ok) throw new Error('bad');
    if (!out.backup){ sheetStatus = {state:'err', msg:'試算表裡還沒有備份，先在有資料的裝置同步一次。', at:sheetStatus.at}; render(); return; }
    const b = out.backup;
    sessions = b.sessions || {}; prog = normalizeProgram(b.prog); cns = b.cns || {};
    lsSet(LS_KEY, sessions); lsSet(LS_PROG, prog); lsSet(LS_CNS, cns); lsSet(PENDING_KEY, 0);
    rebuild();
    sheetStatus = {state:'ok', msg:'', at:Date.now()};
  } catch (e){
    sheetStatus = {state:'err', msg:navigator.onLine ? '讀不到試算表的備份。請確認網址正確。' : '目前離線，無法還原。', at:sheetStatus.at};
  }
  updateBadge(); render();
}

const NUM_PF = ['sets','opt','reps','rpe','rpeStep','dlSets','dlReps','dlPct','dlRpe','rest','day'];
function setProgField(ex, f, el){
  if (f === 'bar') ex.bar = el.checked;
  else if (f === 'repsMax') ex.repsMax = el.value === '' ? null : +el.value;
  else if (NUM_PF.includes(f)) ex[f] = +el.value;
  else ex[f] = el.value;
  if (f === 'reps' && ex.repsMax != null && ex.repsMax <= ex.reps) ex.repsMax = null;
  if (f === 'day'){ const i = prog.exercises.indexOf(ex); prog.exercises.splice(i, 1); prog.exercises.push(ex); }
}
function menuClick(e){
  const t = e.target;
  if (t.closest('[data-reset]')){
    if (!resetArm){ resetArm = true; render(); return true; }
    resetArm = false; prog = Object.assign(defaultProgram(), {updatedAt:0}); openEx.clear(); touchProg(); rebuild(); render(); return true;
  }
  const go = t.closest('[data-goex]');
  if (go){ const id = go.dataset.goex; openEx.add(id); render(); document.querySelector(`.mx[data-id="${id}"]`)?.scrollIntoView({block:'start'}); window.scrollBy(0, -170); return true; }
  const bw = t.closest('[data-basew]');
  if (bw){ const l = bw.dataset.basew, b = prog.base[l];
    pickerOpen({mode:'w', bar:true, target:null, start:b.w, title:`${LIFTS[l]} · 基準重量`, clearLabel:'取消', applyAll:null,
      onCommit:v => { if (v != null){ b.w = v; touchProg(); rebuild(); } }}); return true; }
  const add = t.closest('[data-add]');
  if (add){
    const ex = Object.assign({}, BLANK_EX, {id:'x' + Date.now().toString(36), day:+add.dataset.add});
    prog.exercises.push(ex); openEx.add(ex.id); touchProg(); rebuild(); render();
    document.querySelector(`.mx[data-id="${ex.id}"]`)?.scrollIntoView({block:'center'});
    return true;
  }
  const mx = t.closest('.mx'); if (!mx) return false;
  const ex = EXBY[mx.dataset.id]; if (!ex) return false;
  if (t.closest('[data-toggle]')){ openEx.has(ex.id) ? openEx.delete(ex.id) : openEx.add(ex.id); delArm = null; render(); return true; }
  const pkb = t.closest('[data-pick]');
  if (pkb){
    if (pkb.dataset.pick === 'start')
      pickerOpen({mode:'w', bar:ex.bar, target:null, start:ex.start ?? 20, title:`${esc(ex.name)} · W1 起始重量<small>之後每週依增量自動加重</small>`, clearLabel:'不設重量', applyAll:null,
        onCommit:v => { ex.start = v; touchProg(); rebuild(); }});
    else
      pickerOpen({mode:'p', bar:false, target:null, start:ex.inc || 0, title:`${esc(ex.name)} · 每週增加重量<small>累積期每週加上的總重量</small>`, clearLabel:'不加重', applyAll:null,
        onCommit:v => { ex.inc = v || 0; touchProg(); rebuild(); }});
    return true;
  }
  const mv = t.closest('[data-move]');
  if (mv){
    const arr = prog.exercises, i = arr.indexOf(ex), dir = +mv.dataset.move;
    let j = i + dir; while (j >= 0 && j < arr.length && arr[j].day !== ex.day) j += dir;
    if (j >= 0 && j < arr.length){ [arr[i], arr[j]] = [arr[j], arr[i]]; touchProg(); rebuild(); render(); }
    return true;
  }
  if (t.closest('[data-del]')){
    if (delArm !== ex.id){ delArm = ex.id; render(); return true; }
    delArm = null; prog.exercises.splice(prog.exercises.indexOf(ex), 1); openEx.delete(ex.id); touchProg(); rebuild(); render(); return true;
  }
  return false;
}

  if (t.dataset.base){ prog.base[t.dataset.base][t.dataset.bk] = +t.value; touchProg(); rebuild(); return true; }
  const f = t.dataset.pf; if (!f || t.type === 'text' || t.tagName === 'TEXTAREA') return !!f;
  const ex = EXBY[t.closest('.mx').dataset.id];
  setProgField(ex, f, t); touchProg(); rebuild(); render(); return true;
}
function menuInput(e){
  const t = e.target;
  if (t.dataset.dayf){ DAYS[t.dataset.day][t.dataset.dayf] = t.value; touchProg(); return true; }
  const f = t.dataset.pf; if (!f || !(t.type === 'text' || t.tagName === 'TEXTAREA')) return !!f;
  const mx = t.closest('.mx'), ex = EXBY[mx.dataset.id];
  ex[f] = t.value; touchProg();
  if (f === 'name') mx.querySelector('[data-sumname]').textContent = t.value;
  if (f === 'wNote') mx.querySelector('[data-sum]').innerHTML = exSummary(ex);
  return true;
}

function renderGuide(){
  const w = ui.week, dlEx = EX.find(e => e.main === 'dead') || EX.find(e => e.cat === 'dead');
  const dlp = dlEx ? rx(dlEx, w) : null, dl = dlp && !dlp.cancelled ? dlp.w : null;
  const warm = [
    ['第 1 組', r25(dl*0.4), '40%', '5 下', '60 秒', '建立動作軌跡，槓鈴貼脛骨，專注起槓腳踩地感與呼吸閥式。'],
    ['第 2 組', r25(dl*0.6), '60%', '3 下', '60-90 秒', '喚醒拉力虛位 (Slack Out)，聽見槓片清脆聲，背闊肌夾緊。'],
    ['第 3 組', r25(dl*0.78), '75-80%', '2 下', '90 秒', '加快離地爆發力，次數降至 2 下，嚴禁在此累積乳酸疲勞。'],
    ['第 4 組', r25(dl*0.9), '90%', '1 下', '2 分鐘', '繫上腰帶，只拉 1 下！讓神經適應接近目標重量的重壓感。'],
    ['第 5 組（可選）', r25(dl*0.95), '95%', '1 下', '2-3 分鐘', '銜接組（若前一組速度極快可跳過），確認起槓信心。'],
  ];
  const p = dlp || {};
  const items = [
    ['熱身異常沉重','平常輕快的熱身重量（如深蹲 80 kg、硬舉 100 kg）出架時感覺異常沉重、速度明顯變慢。','train'],
    ['RPE 嚴重漂移','相同重量下，連續兩次訓練日 RPE 向上漂移超過 1.5-2 級（例如 100 kg 5 下從 7.5 變成 9.5）。','train'],
    ['握力明顯衰退','硬舉熱身手指發虛滑動，或單槓懸垂時間急遽縮短。','train'],
    ['生理與睡眠異變','晨間靜態心率連續 2-3 天偏高 5-8 bpm、身體極累大腦卻興奮早醒。','body']
  ];
  const ck = cns['w'+w] || {};
  const hot = items.some((it,i) => it[2]==='train' && ck[i]) && ck[3];
  let h = `<div class="dayhead"><span class="eyebrow">第 ${w} 週 · ${WEEKS[w-1].label}</span><h2>訓練指南</h2></div>
  <div class="card prose"><h3>波浪推進法則</h3>
    <p>目前菜單：${prog.cycle.accum} 週累積${prog.cycle.deload ? ` + ${prog.cycle.deload} 週減量` : ''}為一個波浪，共 ${prog.cycle.waves} 個波浪（${TOTAL_WEEKS} 週）。累積期每週依各動作設定的增量加重；新波浪從上一波第 1 週再提升 ${prog.cycle.shift} 次增量重新開始。</p>
    <p>減量週組數減半、重量降至 65-70% 左右，消退中樞神經與關節疲勞。各動作的減量細節可在「菜單」頁調整。</p>
    <p class="muted small" style="margin:0">頻率：練一休一（如週一、三、五、日）。第 1 週核心任務是校準動作軌跡、守住 RPE 7-8，不搶快加重。</p></div>
  ${dl ? `<div class="card"><h3>硬舉熱身配置（本週正式組 ${fmt(dl)} kg）</h3>
    <div class="tbl-wrap"><table><thead><tr><th>順序</th><th>重量</th><th>強度</th><th>次數</th><th>休息</th><th>重點</th></tr></thead><tbody>
    ${warm.map(r => `<tr><td>${r[0]}</td><td class="n">${fmt(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}
    <tr class="work"><td><b>正式組</b></td><td class="n">${fmt(dl)}</td><td>100%</td><td>${p.setsText}×${p.repsText}</td><td>3-4 分鐘</td><td>目標 RPE ${p.rpe}，每組保留餘力。</td></tr>
    </tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">依當週硬舉目標重量換算，四捨五入到 2.5 kg。</p></div>` : ''}
  <div class="card"><h3>CNS 疲勞檢核（第 ${w} 週）</h3>
    ${items.map((it,i) => `<label class="check"><input type="checkbox" data-cns="${i}" ${ck[i]?'checked':''}><span><b>${it[0]}</b><span class="muted small">${it[1]}</span></span></label>`).join('')}
    <div class="redline${hot?' hot':''}"><b>紅線法則：</b>若同時出現「訓練指標漂移」與「生理睡眠指標惡化」，當週立刻轉為減量週，絕不硬拼！${hot ? '<br><b>目前已觸發，建議本週改做減量。</b>' : ''}</div></div>
  ${renderVolume(w, false)}`;
  return h;
}

function render(){
  renderHeader();
  const v = document.getElementById('view');
  v.innerHTML = ui.tab === 'log' ? renderLog() : ui.tab === 'prog' ? renderProg() : ui.tab === 'menu' ? renderMenu() : renderGuide();
  if (ui.tab === 'prog') bindTrend();
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === ui.tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
}
function saveUI(){ lsSet(LS_UI, ui); }

/* ---------- events ---------- */
document.getElementById('weeks').addEventListener('click', e => {
  const b = e.target.closest('[data-week]'); if (!b) return;
  ui.week = +b.dataset.week; saveUI(); render(); window.scrollTo({top:0});
});
document.getElementById('days').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  ui.day = +b.dataset.day; saveUI(); render(); window.scrollTo({top:0});
});
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; saveUI(); render(); window.scrollTo({top:0});
});

const view = document.getElementById('view');
view.addEventListener('click', e => {
  const vm = e.target.closest('[data-volmode]');
  if (vm){ ui.volMode = vm.dataset.volmode; saveUI(); render(); return; }
  const vp = e.target.closest('[data-volpart]');
  if (vp){ const c = vp.dataset.ctx, k = vp.dataset.volpart; volPart[c] = volPart[c] === k ? null : k; render(); return; }
  if (ui.tab === 'menu' && menuClick(e)) return;
  if (e.target.closest('[data-sync]')){ syncSheet(false); return; }
  if (e.target.closest('[data-restore]')){ if (!restoreArm){ restoreArm = true; render(); return; } restoreArm = false; restoreFromSheet(); return; }
  const go = e.target.closest('[data-go]');
  if (go){ const [w, d] = go.dataset.go.split('-').map(Number); Object.assign(ui, {week:w, day:d, tab:'log'}); saveUI(); render(); window.scrollTo({top:0}); return; }
  const wp = e.target.closest('[data-wpick]');
  if (wp){ openPicker(wp.closest('.ex').dataset.ex, +wp.closest('.srow').dataset.i, 'w'); return; }
  const rp = e.target.closest('[data-rpick]');
  if (rp){ openPicker(rp.closest('.ex').dataset.ex, +rp.closest('.srow').dataset.i, 'r'); return; }
  const chk = e.target.closest('[data-chk]');
  if (chk){
    const row = chk.closest('.srow'), exEl = chk.closest('.ex'), ex = EXBY[exEl.dataset.ex], i = +row.dataset.i;
    const s = ensureSession(ui.week, ui.day), r = setRow(s, ex.id, i);
    r.ok = !r.ok;
    if (r.ok){
      const p = rx(ex, ui.week);
      if (!r.w && p.w != null) r.w = fmt(p.w);
      if (!r.r && p.reps != null) r.r = String(p.reps);
      if (!s.date) s.date = todayISO();
      const last = i === p.rows - 1;
      startTimer(ex.rest, last ? `${ex.name} 完成 · 換下一個動作` : `${ex.name} 第 ${i+2} 組 · 休息 ${Math.round(ex.rest/60*2)/2} 分鐘`);
    }
    touch(key(ui.week, ui.day)); render(); return;
  }
  if (e.target.id === 'finish'){
    const s = ensureSession(ui.week, ui.day);
    s.done = !s.done; if (s.done && !s.date) s.date = todayISO();
    if (s.done){ clearInterval(tTick); tEl.hidden = true; }
    touch(key(ui.week, ui.day)); render();
    if (s.done) syncSheet(true);
  }
});
view.addEventListener('input', e => {
  if (ui.tab === 'menu'){ menuInput(e); return; }
  const f = e.target.dataset.f;
  if (f){
    const row = e.target.closest('.srow'), exEl = e.target.closest('.ex'), i = +row.dataset.i;
    const s = ensureSession(ui.week, ui.day), r = setRow(s, exEl.dataset.ex, i);
    r[f] = e.target.value.trim();
    if (f === 'rpe') e.target.classList.toggle('empty', !r.rpe);
    if (f === 'w'){
      const pl = exEl.querySelector('[data-plates]');
      if (pl) pl.innerHTML = plates(firstNum(r.w) ?? rx(EXBY[exEl.dataset.ex], ui.week).w);
    }
    touch(key(ui.week, ui.day));
  } else if (e.target.id === 'noteIn' || e.target.id === 'dateIn'){
    const s = ensureSession(ui.week, ui.day);
    if (e.target.id === 'noteIn') s.note = e.target.value; else s.date = e.target.value || null;
    touch(key(ui.week, ui.day));
  }
});
view.addEventListener('focusin', e => {
  const f = e.target.dataset.f; if (f !== 'w') return;
  const pl = e.target.closest('.ex').querySelector('[data-plates]');
  if (pl) pl.innerHTML = plates(firstNum(e.target.value) ?? firstNum(e.target.placeholder));
});
view.addEventListener('change', e => {
  if (ui.tab === 'menu'){ menuChange(e); return; }
  if (e.target.dataset.hook != null){
    const v = e.target.value.trim();
    lsSet(SHEET_URL_KEY, /^https:\/\/script\.google\.com\/.+\/exec/.test(v) ? v : '');
    sheetStatus = {state:'idle', msg:/^https?:/.test(v) && !getHook() ? '' : '', at:sheetStatus.at};
    if (v && !getHook()) sheetStatus = {state:'err', msg:'網址格式不對，應該是 https://script.google.com/macros/s/…/exec', at:sheetStatus.at};
    render(); if (getHook()) syncSheet(false); return;
  }
  if (e.target.id === 'chartEx'){ ui.chartEx = e.target.value; saveUI(); render(); return; }
  if (e.target.dataset.cns != null){
    const k = 'w' + ui.week; cns[k] = cns[k] || {}; cns[k][e.target.dataset.cns] = e.target.checked;
    lsSet(LS_CNS, cns); render();
  }
});

render();
updateBadge();
window.addEventListener('online', () => { updateBadge(); if (lsGet(PENDING_KEY, 0)) syncSheet(true); });
window.addEventListener('offline', updateBadge);
if (navigator.onLine && lsGet(PENDING_KEY, 0)) setTimeout(() => syncSheet(true), 1500);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>

</body>
</html>
